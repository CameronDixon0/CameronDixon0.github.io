<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAT2004 — Exam Practice</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/lectures.js"></script>
<script src="js/progress.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="js/theme.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-text">
    <h1>STAT2004 <span>Exam Practice</span></h1>
    <p class="tagline">Statistical Modelling &amp; Analysis — pick your topics and difficulty, then reveal answers when ready.</p>
  </div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.9 13.1A8.5 8.5 0 1 1 10.9 3.1a6.6 6.6 0 0 0 10 10Z"/>
    </svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.1"/>
      <path d="M12 2.4v2.2M12 19.4v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>
    </svg>
  </button>
</header>

<main class="layout">

  <aside class="panel">
    <section class="filter-group">
      <h2>Progress</h2>
      <div class="chips" id="status-chips"></div>
    </section>

    <section class="filter-group">
      <h2>Exam</h2>
      <div class="chips" id="exam-chips"></div>
    </section>

    <section class="filter-group">
      <h2>Difficulty</h2>
      <div class="chips" id="difficulty-chips"></div>
    </section>

    <section class="filter-group">
      <h2>Source</h2>
      <div class="chips" id="source-chips"></div>
    </section>

    <section class="filter-group">
      <h2>Topics</h2>
      <div class="chips" id="topic-chips"></div>
    </section>

    <div class="panel-actions">
      <button class="ghost small" id="clear" type="button">Clear all filters</button>
      <button class="link small" id="reset-progress" type="button">Reset progress</button>
    </div>
  </aside>

  <section class="stage">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <button class="ghost small" id="shuffle" type="button">Shuffle</button>
    </div>

    <article class="card" id="card"></article>

    <nav class="controls">
      <button class="ghost" id="prev" type="button">← Previous</button>
      <button class="ghost" id="hint" type="button">Hint</button>
      <button class="primary" id="reveal" type="button">Reveal answer</button>
      <button class="ghost" id="next" type="button">Next →</button>
    </nav>

    <p class="hint">Tip: use <kbd>←</kbd> <kbd>→</kbd> to move between questions, <kbd>H</kbd> for a hint, <kbd>R</kbd> to reveal, and <kbd>F</kbd> / <kbd>S</kbd> / <kbd>T</kbd> to flag, star or tick.</p>
  </section>

</main>

<script src="js/questions/week02.js"></script>
<script src="js/questions/week03.js"></script>
<script src="js/questions/week04.js"></script>
<script src="js/questions/week05.js"></script>
<script src="js/questions/week06.js"></script>
<script src="js/questions/week07.js"></script>
<script src="js/questions/week08.js"></script>
<script src="js/questions/week09.js"></script>
<script src="js/questions/week10.js"></script>
<script src="js/questions/week11.js"></script>
<script src="js/questions/week12.js"></script>
<script src="js/questions/week13.js"></script>
<script src="js/questions/assign01.js"></script>
<script src="js/questions/assign02.js"></script>
<script src="js/questions/assign03.js"></script>
<script src="js/questions/assign04.js"></script>
<script src="js/app.js"></script>
</body>
</html>
